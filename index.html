<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#e2e5ea;--pr:#1b5fd1;--hd:#eef2f9}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2c323d;--pr:#6ea0ff;--hd:#232936}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--mu);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.c b{display:block;font-size:19px;margin-top:2px}
.c span{color:var(--mu);font-size:12px}
.info{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.info summary{cursor:pointer;font-weight:bold}
.info dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0}
.info dt{color:var(--mu)}.info dd{margin:0;word-break:break-word}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tools input,.tools select{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-size:14px}
.tools input{flex:1 1 220px}
.cnt{color:var(--mu);margin:4px 0 8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:var(--hd);cursor:pointer;white-space:nowrap;position:sticky;top:0;user-select:none}
th.s::after{content:" ▲"}th.s.d::after{content:" ▼"}
td.n,th.n{text-align:right}
td.n{white-space:nowrap}
a{color:var(--pr);text-decoration:none}a:hover{text-decoration:underline}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--hd)}
.hab{color:#c0392b;font-weight:bold}
.pg{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.pg button{padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer}
.pg button:disabled{opacity:.4;cursor:default}
.note{color:var(--mu);font-size:12px;margin-top:16px}
</style>
</head>
